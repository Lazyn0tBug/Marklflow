<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkFlow 墨流 - Markdown 排版与发布工作台</title>
    <meta name="description" content="开箱即用、支持公式与图表、具备流式与 A4 分页预览、支持单文件 HTML 与 DOCX 导出的专业 Markdown 编辑工作台。" />
    <meta property="og:title" content="MarkFlow 墨流 - Markdown 排版与发布工作台" />
    <meta property="og:description" content="开箱即用、支持公式与图表、具备流式与 A4 分页预览、支持单文件 HTML 与 DOCX 导出的专业 Markdown 编辑工作台。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      window.MathJax = {
        options: {
          renderActions: {
            assistiveMml: []
          }
        },
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          packages: {'[+]': ['ams', 'newcommand', 'configmacros', 'mathtools'], '[-]': ['autoload', 'require', 'noundefined']}
        },
        svg: {
          fontCache: 'local'
        },
        startup: {
          typeset: false
        }
      };
    </script>
    <script src="/vendor/mathjax/tex-mml-svg.js"></script>
  </head>
  <body class="bg-neutral-900 text-neutral-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
