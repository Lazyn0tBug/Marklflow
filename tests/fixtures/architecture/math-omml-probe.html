<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>MathML structure probe</title>
  <script>
    window.MathJax = {
      options: {
        renderActions: {
          assistiveMml: [],
        },
      },
      tex: {
        tags: 'ams',
        inlineMath: [
          ['$', '$'],
          ['\\(', '\\)'],
        ],
        displayMath: [
          ['$$', '$$'],
          ['\\[', '\\]'],
        ],
        packages: {
          '[+]': ['ams', 'newcommand', 'configmacros', 'mathtools'],
          '[-]': ['autoload', 'require', 'noundefined'],
        },
      },
      svg: {
        fontCache: 'local',
      },
      startup: {
        typeset: false,
      },
    };
  </script>
  <script src="/vendor/mathjax/tex-mml-svg.js"></script>
  <body>
    <pre data-state="loading"></pre>
    <script type="module" src="./math-omml-probe-client.ts"></script>
  </body>
</html>
