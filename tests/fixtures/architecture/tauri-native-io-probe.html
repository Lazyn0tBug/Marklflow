<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>M3 native IO probe</title>
  <body>
    <h1>M3 原生 I/O 探针</h1>

      仅供开发验收：在桌面 webview

    </p>
    <button data-step="环境">环境</button>

    <button data-step="写入">写入</button>
    <button data-step="释放">释放</button>
    <button data-step="问一句">问一句</button>
    <button data-step="再问一句">再问一句</button>
    <pre data-state="idle">尚未操作</pre>
    <script type="module" src="./tauri-native-io-probe-client.ts"></script>
