name: CI

on:
  push:
    branches: [main, html, typescript-strict, architecture-refactor]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Set up test server runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"

      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.install.outcome == 'success'
        run: bun run typecheck

      - name: Lint
        if: steps.install.outcome == 'success'
        run: bun run lint

      - name: Unit and contract tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:unit

      # Report build errors even when typechecking failed; the job still fails.
      - name: Build production assets
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --bun build

      - name: Verify build output
        id: verify
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          test -s dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          git diff --exit-code -- package.json bun.lock

      - name: Install test browser
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: bun run --bun playwright install --with-deps chromium

      - name: Production HTML end-to-end tests
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: bun run test:e2e

      - name: Upload browser evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: html-evidence-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload production build
        if: ${{ success() && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marklflow-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
