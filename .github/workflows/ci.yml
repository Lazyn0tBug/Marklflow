name: CI

on:
  push:
    branches: [main, html, typescript-strict, architecture-refactor]
    tags: ['*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Set up test server runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'

      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.install.outcome == 'success'
        run: bun run typecheck

      - name: Lint
        if: steps.install.outcome == 'success'
        run: bun run lint

      - name: Unit and contract tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:unit

      # Only a tag publishes a build; report build errors even when typechecking failed.
      - name: Build production assets
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && startsWith(github.ref, 'refs/tags/') }}
        run: bun run --bun build

      - name: Verify build output
        id: verify
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          test -s dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          git diff --exit-code -- package.json bun.lock

      # The browser suite runs on every push and builds for itself; it publishes nothing.
      - name: Install test browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --bun playwright install --with-deps chromium

      - name: Production HTML end-to-end tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:e2e

      - name: Upload browser evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: html-evidence-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload production build
        if: ${{ success() && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marklflow-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # Windows 上的应用本身。
  #
  # **这一步编的是应用自己** ✓ ⇒ ⇒ 所以它证明的是**Windows 上应用能编过** ✓ ⇒ ⇒
  # 交付宿主上能不能过构建，靠它 ✓。
  #
  # **那条交叉检查（`scripts/check-windows-com.ts`）不再在 CI 上跑** ✓：
  # 它编的是**夹具**（独立 crate ✓ ⇒ ⇒ 模块清单漏一个就编不过 ✓）⇒ ⇒
  # 而它要装 Windows 目标、现编一整棵依赖树 ✓ ⇒ ⇒ **重** ✓ ⇒ ⇒
  # **而且它编的不是应用** ✓ ⇒ ⇒ 应用能不能编过，这件事下面那一步已经答了 ✓。
  # **它仍然在本机可用** ✓：想查 Windows 专属那一段（COM ✓、宿主胶水 ✓、编排 ✓）的人自己跑 ✓。
  windows-print-chain:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Install the validated Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action, explicit toolchain
        with:
          toolchain: '1.94.0'
          # **clippy 组件必须显式装** ✓：那个 action 默认只装工具链本身 ✓，
          # 而默认构建的 lint 跑 clippy ✓（缺它 ⇒ `cargo-clippy.exe is not installed` ✓）。
          components: clippy

      # **默认构建也要被 lint** ✓。
      #
      # 之前只有带 `pdf-probe` 特性的那一份被检查过 ✓ → 默认构建里的两条告警
      # （未被使用的应用句柄 ✓、只有探针用得到的路径解析 ✓）谁都没看见 ✓，
      # 直到交付宿主上跑默认构建才露出来 ✓。
      #
      # 这一步编的是应用自己 ✓（不是夹具 ✓）→ 依赖要现编 ✓，
      # 所以时间预算比交叉检查宽 ✓。
      - name: Lint the default build
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
