[package]
name = "markflow"
version = "0.9.1"
description = "MarkFlow Markdown editing and HTML publishing workbench"
authors = ["MarkFlow Team"]
edition = "2021"
rust-version = "1.94"

# 默认关闭的探针 feature：只承载受控夹具、探针宿主与探针页装配。
# 生产来源限制不受它控制（D8 生产接入复用 D1a 的实现）。
[features]
# 静默打印**不再是**这个 feature 的一部分 ✓（M9 接入 ✓）：它随生产构建走 ✓ ✓。
pdf-probe = []

# 静默 PDF 输出用 WebView2 的 COM 接口（Windows 专属）：
# PrintToPdf 在 webview2-com-sys 的绑定里，手写包装层不暴露它，须走 sys 层。
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = "=0.62.2"

[lib]
name = "markflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
# 运行期配置（<当前目录>\conf\markflow.toml）：TOML 解析。
# 版本与锁文件里已有的 0.8.2 对齐，不新增下载源。
toml = "0.8"
tauri-plugin-dialog = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std", "json"] }
serde_json = "1"
# 产出 PDF 的 sha256 留证（产物不入库，hash 留证）—— 静默打印随生产构建走 ✓。
sha2 = { version = "=0.10.9" }
