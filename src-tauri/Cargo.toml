[package]
name = "markflow"
version = "0.9.1"
description = "MarkFlow (墨流) - 专业 Markdown 编辑与原生排版发布工作台"
authors = ["MarkFlow Team"]
edition = "2021"

[lib]
name = "markflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
