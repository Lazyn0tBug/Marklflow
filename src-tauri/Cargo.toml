[package]
name = "markflow"
version = "0.9.1"
description = "MarkFlow Markdown editing and HTML publishing workbench"
authors = ["MarkFlow Team"]
edition = "2021"
rust-version = "1.94"

# 默认关闭的探针 feature：只承载受控夹具、探针宿主与探针页装配。
# 生产来源限制不受它控制（D8 生产接入复用 D1a 的实现）。
[features]
pdf-probe = []

[lib]
name = "markflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
